services:
  sweepkey-landing:
    build:
      context: .
      dockerfile: Dockerfile
    image: sweepkey-landing:latest
    container_name: sweepkey-landing
    restart: unless-stopped
    ports:
      # 8090 so it can run next to deckTv (8080).
      - "8090:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
