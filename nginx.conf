server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # Container health check (Dockerfile HEALTHCHECK, docker-compose healthcheck).
    location = /health {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        return 200 '{"status":"ok","service":"sweepkey-landing"}';
    }

    # DMG mirror: always a download, cached long (file names are versioned), never the HTML fallback.
    location ^~ /downloads/ {
        types { application/x-apple-diskimage dmg; }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Hashed build assets.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Unhashed images, logos, video and icons: cache, but revalidate.
    location ~* \.(?:png|jpg|jpeg|gif|webp|avif|svg|ico|mp4|webm)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Pages are built as files (build.format: 'file'): /404 -> /404.html.
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
